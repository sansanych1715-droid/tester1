<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренер інтерв'ю з React для junior</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --color-primary: #4A90D9;
      --color-neutral-bg: #F5F5F5;
      --color-neutral-text: #333333;
      --color-rating-0: #E53935;
      --color-rating-1: #FFA726;
      --color-rating-2: #8BC34A;
      --color-rating-3: #42A5F5;
      --spacing-sm: .5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --mobile-max: 320px;
      --tablet-break: 768px;
      --desktop-break: 1024px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--color-neutral-bg); color: var(--color-neutral-text); min-height: 100vh; }
    .skip-link { position: absolute; top: -40px; left: 6px; background: var(--color-primary); color: #fff; padding: 8px; text-decoration: none; border-radius: 4px; z-index: 1000; }
    .skip-link:focus { top: 6px; }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
        @media (max-width: 768px) { body { font-size: .875rem; } }
    
    /* Home View */
    .home-view { max-width: 600px; margin: 4rem auto; padding: 1rem; text-align: center; }
    .home-view h1 { font-size: 1.75rem; margin-bottom: 2rem; }
    .mode-buttons { display: flex; flex-direction: column; gap: 1rem; }
    .mode-buttons button { padding: 1rem; font-size: 1.1rem; border: none; border-radius: 8px; background: var(--color-primary); color: #fff; cursor: pointer; transition: transform .2s, background .2s; }
    .mode-buttons button:hover { background: #3A7BC8; transform: translateY(-2px); }
    .mode-buttons button:focus { outline: 2px solid var(--color-primary); }
    
    /* Quick Test Button */
    .quick-test-btn {margin-top: 10px; padding: 1rem; font-size: 1.1rem; border: none; border-radius: 8px; background: var(--color-primary); color: #fff; cursor: pointer; transition: transform .2s, background .2s; }
    .quick-test-btn:hover { background: #3A7BC8; transform: translateY(-2px); }
    .quick-test-btn:focus { outline: 2px solid var(--color-primary); }
    
    /* Interview Test Button */
    .interview-test-btn {margin-top: 10px; padding: 1rem; font-size: 1.1rem; border: none; border-radius: 8px; background: #667eea; color: #fff; cursor: pointer; transition: transform .2s, background .2s; }
    .interview-test-btn:hover { background: #5568d3; transform: translateY(-2px); }
    .interview-test-btn:focus { outline: 2px solid var(--color-primary); }
    
    /* Quick Test View */
    .quick-test-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .quick-test-back-btn { background: none; border: none; color: var(--color-primary); cursor: pointer; font-size: 1rem; }
    .quick-test-back-btn:hover { text-decoration: underline; }
    .quick-test-progress { font-size: .9rem; color: var(--color-neutral-text); }
    
    /* Practice View */
    .practice-layout { max-width: 800px; margin: 0 auto; padding: 1rem; }
    .practice-nav { margin-bottom: 1rem; }
    .practice-nav button { background: none; border: none; color: var(--color-primary); cursor: pointer; font-size: .9rem; }
    .practice-nav button:hover { text-decoration: underline; }
    .progress-container { margin-bottom: 1.5rem; }
    .progress-text { font-size: .9rem; margin-bottom: .5rem; }
    .progress-bar { width: 100%; height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--color-primary); transition: width .3s ease; }
    
    .question-card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .question-text { font-size: 1.25rem; margin-bottom: 1rem; line-height: 1.5; }
    .answer-input { width: 100%; min-height: 120px; padding: .75rem; border: 2px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 1rem; margin-bottom: 1rem; resize: vertical; }
    .answer-input:focus { border-color: var(--color-primary); outline: none; }
    .submit-btn, .skip-btn { padding: .5rem 1rem; border: none; border-radius: 6px; cursor: pointer; margin-right: .5rem; }
    .submit-btn { background: var(--color-primary); color: #fff; }
    .submit-btn:hover { background: #3A7BC8; }
    .skip-btn { background: #e0e0e0; color: var(--color-neutral-text); }
    .skip-btn:hover { background: #d0d0d0; }
    
    .answers-panel { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .answer-section { margin-bottom: 1rem; }
    .answer-section h3 { font-size: 1rem; margin-bottom: .5rem; color: var(--color-neutral-text); }
    .answer-content { line-height: 1.6; }
    .rating-section { margin-top: 1rem; text-align: center; }
    .rating-section h3 { font-size: 1rem; margin-bottom: .75rem; }
    .rating-buttons { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; }
    .rating-btn { padding: .5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; }
    .rating-0 { background: var(--color-rating-0); color: #fff; }
    .rating-1 { background: var(--color-rating-1); color: #fff; }
    .rating-2 { background: var(--color-rating-2); color: #fff; }
    .rating-3 { background: var(--color-rating-3); color: #fff; }
    .next-btn { margin-top: 1rem; padding: .5rem 1.5rem; border: none; border-radius: 6px; background: var(--color-primary); color: #fff; cursor: pointer; }
    .next-btn:hover { background: #3A7BC8; }
    
    .loading-screen { text-align: center; padding: 2rem; }
    
    /* Timer */
    .timer { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1rem; border-radius: 8px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1); font-weight: 600; }
    .timer.warning { color: var(--color-rating-1); }
    .timer.critical { color: var(--color-rating-0); }
    
    /* Quiz Setup Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #fff; border-radius: 12px; padding: 2rem; max-width: 500px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
    .modal h2 { margin-bottom: 1.5rem; font-size: 1.5rem; text-align: center; }
    .modal-section { margin-bottom: 1.5rem; }
    .modal-section label { display: block; margin-bottom: .5rem; font-weight: 600; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: .5rem; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: .75rem; border-radius: 6px; }
    .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; }
    .cancel-btn { padding: .6rem 1.5rem; border: none; border-radius: 6px; background: #e0e0e0; color: var(--color-neutral-text); cursor: pointer; }
    .start-btn { padding: .75rem 1.5rem; border: none; border-radius: 6px; background: var(--color-primary); color: #fff; cursor: pointer; font-size: 1rem; }
    .start-btn:hover { background: #3A7BC8; }
    
    /* Results View */
    .results-view { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .results-header { text-align: center; margin-bottom: 2rem; }
    .results-header h1 { font-size: 1.75rem; margin-bottom: .5rem; }
    .score-display { font-size: 3rem; font-weight: 700; color: var(--color-primary); }
    .score-label { font-size: 1.1rem; color: var(--color-neutral-text); margin-bottom: 1rem; }
    .category-breakdown { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .category-item { display: flex; justify-content: space-between; padding: .5rem 0; border-bottom: 1px solid #eee; }
    .category-item:last-child { border-bottom: none; }
    .weak-topics { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .weak-topic-item { padding: .75rem; border-bottom: 1px solid #eee; cursor: pointer; color: var(--color-primary); }
    .weak-topic-item:hover { background: #f0f8ff; }
    .weak-topic-item:last-child { border-bottom: none; }
    .stats-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #fff; border-radius: 8px; padding: 1rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--color-primary); }
    .stat-label { font-size: .85rem; color: var(--color-neutral-text); margin-top: .25rem; }
    .results-actions { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
    .retry-btn { padding: .75rem 1.5rem; border: none; border-radius: 8px; background: var(--color-primary); color: #fff; cursor: pointer; font-size: 1rem; }
    .retry-btn:hover { background: #3A7BC8; }
    .home-btn { padding: .75rem 1.5rem; border: none; border-radius: 8px; background: var(--color-neutral-bg); color: var(--color-neutral-text); cursor: pointer; font-size: 1rem; }
    .home-btn:hover { background: #ddd; }
    
    /* Review View */
    .review-view { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .review-item { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); cursor: pointer; border-left: 4px solid var(--color-rating-1); }
    .review-item:hover { background: #fafafa; }
    .review-question { font-weight: 600; margin-bottom: .5rem; }
    .review-meta { font-size: .85rem; color: var(--color-neutral-text); }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--color-neutral-text); }
    .empty-state p { margin-bottom: 1rem; }
    .empty-state a { color: var(--color-primary); cursor: pointer; text-decoration: underline; }
    
    /* Progress Dashboard */
    .dashboard-view { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .dashboard-header { text-align: center; margin-bottom: 2rem; }
    .dashboard-header h1 { font-size: 1.75rem; }
    .progress-bars { margin-top: 1rem; }
    .progress-row { margin-bottom: 1rem; }
    .progress-row-label { display: flex; justify-content: space-between; margin-bottom: .25rem; font-size: .9rem; }
    .progress-bar-full { width: 100%; height: 20px; background: #ddd; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--color-primary); transition: width .3s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: .5rem; color: #fff; font-size: .8rem; font-weight: 600; }
    .reset-btn { background: var(--color-rating-0); color: #fff; border: none; padding: .75rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 1.5rem; }
    .reset-btn:hover { opacity: .9; }
    
    /* Results View */
    .results-view { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .score-display { font-size: 3rem; font-weight: 700; color: var(--color-primary); }
    .category-breakdown { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .weak-topics { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .weak-topic-item { padding: .75rem; border-bottom: 1px solid #eee; cursor: pointer; color: var(--color-primary); }
    .stats-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #fff; border-radius: 8px; padding: 1rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--color-primary); }
        .results-actions { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
    .retry-btn { padding: .75rem 1.5rem; border: none; border-radius: 8px; background: var(--color-primary); color: #fff; cursor: pointer; font-size: 1rem; }
    .retry-btn:hover { background: #3A7BC8; }
    .home-btn { padding: .75rem 1.5rem; border: none; border-radius: 8px; background: var(--color-neutral-bg); color: var(--color-neutral-text); cursor: pointer; font-size: 1rem; }
    .home-btn:hover { background: #ddd; }
    
    /* Review View */
    .review-view { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .review-item { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); cursor: pointer; border-left: 4px solid var(--color-rating-1); }
    .review-item:hover { background: #fafafa; }
    .review-question { font-weight: 600; margin-bottom: .5rem; }
    .review-meta { font-size: .85rem; color: var(--color-neutral-text); }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--color-neutral-text); }
    .empty-state p { margin-bottom: 1rem; }
    .empty-state a { color: var(--color-primary); cursor: pointer; text-decoration: underline; }
    
    /* Progress Dashboard */
    .dashboard-view { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .dashboard-header { text-align: center; margin-bottom: 2rem; }
    .dashboard-header h1 { font-size: 1.75rem; }
    .progress-bars { margin-top: 1rem; }
    .progress-row { margin-bottom: 1rem; }
    .progress-row-label { display: flex; justify-content: space-between; margin-bottom: .25rem; font-size: .9rem; }
    .progress-bar-full { width: 100%; height: 20px; background: #ddd; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--color-primary); transition: width .3s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: .5rem; color: #fff; font-size: .8rem; font-weight: 600; }
    
    /* Filters */
    .filters-section { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .filters-container { background: #fff; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
    .filter-group { flex: 1; min-width: 200px; }
    .filter-group h3 { font-size: 1rem; margin-bottom: .5rem; color: var(--color-neutral-text); }
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
    .checkbox-item { display: flex; align-items: center; gap: .35rem; }
    .checkbox-item input[type="checkbox"] { cursor: pointer; }
    .search-container { position: relative; }
    .search-input { width: 100%; padding: .6rem 1.5rem .6rem .75rem; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; }
    .search-input:focus { border-color: var(--color-primary); outline: none; }
    .clear-filters-btn { padding: .5rem 1rem; border: none; border-radius: 6px; background: #e0e0e0; color: var(--color-neutral-text); cursor: pointer; font-size: .9rem; margin-top: .5rem; }
    .clear-filters-btn:hover { background: #d0d0d0; }
    .filter-actions { display: flex; gap: .5rem; margin-top: 1rem; }
    
    /* Resume Bar */
    .resume-bar { background: var(--color-primary); color: #fff; padding: 1rem; text-align: center; }
    .resume-bar button { background: #fff; color: var(--color-primary); border: none; padding: .5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .resume-bar .resume-text { margin-right: 1rem; }
    
    /* Toast */
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--color-neutral-text); color: #fff; padding: .75rem 1.25rem; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.2); z-index: 1000; opacity: 0; transform: translateY(20px); transition: all .3s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--color-rating-0); }
    
    /* Responsive */
    @media (max-width: 768px) { 
      .home-view { margin: 2rem auto; }
      .modal { padding: 1.5rem; }
      body { font-size: .875rem; }
      .score-display { font-size: 2rem; }
      .filter-row { flex-direction: column; }
      .filter-group { min-width: 100%; }
    }
  </style>
<body>
  <a href="#main-content" class="skip-link" tabindex="-1">Перейти до основного контенту</a>
  <div id="root"></div>
  
  <script src="./main.js"></script>
  <script src="./questionBank.js"></script>
</body>
</html>
